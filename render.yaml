services:
  - type: web
    name: kof-smart-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false        # se pega a mano en el panel de Render (cadena del Session pooler de Supabase)
      - key: CORS_ORIGINS
        sync: false        # p. ej. https://kof-smart.vercel.app,http://localhost:5173
